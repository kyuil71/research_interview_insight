      /* =========================================================
         15-A. 스크롤 박스 (긴 목록 옆의 슬라이드 버튼)
         ========================================================= */
      function scrollBox(id, inner, maxHeight, extraClass) {
        return `<div class="relative">
          <div id="${id}" data-scrollbox="1" class="overflow-y-auto no-scrollbar pr-5 ${extraClass || ""}" style="max-height:${maxHeight}">${inner}</div>
          <div id="${id}-track" class="hidden absolute right-0 top-1 bottom-1 w-3 rounded-full bg-slate-200 border border-slate-300" aria-hidden="true">
            <div id="${id}-thumb" class="absolute left-[1px] right-[1px] rounded-full bg-slate-700 cursor-grab active:cursor-grabbing shadow"></div>
          </div>
        </div>`;
      }

      let sbDrag = null;
      function sbPointerY(e) { return e.touches && e.touches[0] ? e.touches[0].clientY : e.clientY; }
      function sbMove(e) {
        if (!sbDrag) return;
        const { box, thumb, startY, startTop } = sbDrag;
        const span = box.clientHeight - thumb.offsetHeight;
        if (span <= 0) return;
        box.scrollTop = startTop + (sbPointerY(e) - startY) * ((box.scrollHeight - box.clientHeight) / span);
        if (e.cancelable) e.preventDefault();
      }
      window.addEventListener("mousemove", sbMove);
      window.addEventListener("touchmove", sbMove, { passive: false });
      window.addEventListener("mouseup", () => { sbDrag = null; });
      window.addEventListener("touchend", () => { sbDrag = null; });

      // 헤더와 도크의 실제 높이를 재어 본문 여백을 맞춥니다. (화면마다 도크 높이가 달라 생기는 어색한 간격 제거)
      function syncLayout() {
        const page = document.querySelector(".dock-space, .page-top");
        if (!page) return;
        const head = document.querySelector("header.fixed");
        const bar = document.querySelector(".dock");
        page.style.paddingTop = ((head ? head.offsetHeight : 56) + 40) + "px";
        if (page.classList.contains("dock-space")) {
          page.style.paddingBottom = ((bar ? bar.offsetHeight : 150) + 32) + "px";
        }
      }

      function initScrollBoxes() {
        document.querySelectorAll("[data-scrollbox]").forEach(box => {
          const track = document.getElementById(box.id + "-track");
          const thumb = document.getElementById(box.id + "-thumb");
          if (!track || !thumb) return;
          if (box.scrollHeight - box.clientHeight <= 6) { track.classList.add("hidden"); return; }
          track.classList.remove("hidden");
          const sync = () => {
            const h = Math.max(40, Math.round(box.clientHeight * (box.clientHeight / box.scrollHeight)));
            const span = box.clientHeight - h;
            const ratio = box.scrollTop / (box.scrollHeight - box.clientHeight || 1);
            thumb.style.height = h + "px";
            thumb.style.top = Math.round(ratio * span) + "px";
          };
          sync();
          box.addEventListener("scroll", sync, { passive: true });
          const start = (e) => {
            sbDrag = { box, thumb, startY: sbPointerY(e), startTop: box.scrollTop };
            if (e.cancelable) e.preventDefault();
          };
          thumb.addEventListener("mousedown", start);
          thumb.addEventListener("touchstart", start, { passive: false });
          track.addEventListener("click", (e) => {
            if (e.target === thumb) return;
            const r = track.getBoundingClientRect();
            box.scrollTop = ((e.clientY - r.top) / r.height) * (box.scrollHeight - box.clientHeight);
          });
        });
      }

      /* =========================================================
         15-C. 원본 파일 연결 기억 (File System Access + IndexedDB)
         ========================================================= */
      const FILE_DB = { name: "design_research_files_v1", store: "handles" };
      let fileDbPromise = null;

      function openFileDb() {
        if (!("indexedDB" in window)) return Promise.reject(new Error("IDB_UNAVAILABLE"));
        if (fileDbPromise) return fileDbPromise;
        fileDbPromise = new Promise((res, rej) => {
          const req = indexedDB.open(FILE_DB.name, 1);
          req.onupgradeneeded = () => {
            const db = req.result;
            if (!db.objectStoreNames.contains(FILE_DB.store)) db.createObjectStore(FILE_DB.store, { keyPath: "id" });
          };
          req.onsuccess = () => res(req.result);
          req.onerror = () => rej(req.error || new Error("IDB_OPEN_FAILED"));
        });
        return fileDbPromise;
      }
      function fileDbAction(mode, fn) {
        return openFileDb().then(db => new Promise((res, rej) => {
          const tx = db.transaction(FILE_DB.store, mode);
          const rq = fn(tx.objectStore(FILE_DB.store));
          rq.onsuccess = () => res(rq.result);
          rq.onerror = () => rej(rq.error || new Error("IDB_REQUEST_FAILED"));
        }));
      }
      async function saveFileLink(id, fileName, handle) {
        if (!id) return;
        try { await fileDbAction("readwrite", st => st.put({ id, fileName, handle: handle || null, savedAt: Date.now() })); }
        catch (e) { console.warn("파일 연결 저장 실패", e); }
      }
      async function loadFileLink(id) {
        if (!id) return null;
        try { return await fileDbAction("readonly", st => st.get(id)); }
        catch (e) { return null; }
      }

      function nemoRawFields(row) {
        const out = [];
        let total = 0;
        for (const f of Object.keys(row || {})) {
          if (f.startsWith("__") || f === "localScore") continue;
          const v = String(row[f] ?? "").trim();
          if (!v) continue;
          const val = v.length > 700 ? v.slice(0, 699) + "…" : v;
          if (total + val.length > 3500) break;
          total += val.length;
          out.push({ field: f, value: val });
        }
        return out;
      }

      function viewTaskAnalysis() {
        const a = state.taskAnalysis || {};
        const chips = nemoUniq([...nemoArr(a.keywords), ...nemoArr(a.expandedKeywords), ...nemoArr(a.bilingualTerms)]).slice(0, 24);
        const hasData = state.nemoRows.length > 0;
        const done = state.categories.length > 0;
        return `<div class="page-top px-4 dock-space animate-fade-in">
          ${subHeader("과제 특성 분석", 1, done ? 2 : null)}
          <h2 class="t-h1 text-slate-900 mb-3">과제를 이렇게 해석했습니다</h2>
          <p class="t-small text-slate-600 mb-8">이 해석이 실제 데이터에서 후보를 찾는 검색 기준이 됩니다. 어긋난 부분이 있으면 아래에서 다시 분석해 주세요.</p>

          ${nemoReconnectBanner()}

          <section class="bg-white border-2 border-slate-300 rounded-3xl shadow-md mb-6 overflow-hidden">
            ${nemoAnalysisRow(1, "핵심 목적", a.researchIntent)}
            ${nemoAnalysisRow(2, "주요 탐색 영역", a.importantContexts)}
            ${nemoAnalysisRow(3, "관련 사용자 유형", a.personaTypes)}
            ${nemoAnalysisRow(4, "예상되는 불편", a.painPoints)}
            ${nemoAnalysisRow(5, "잠재 니즈", a.needs)}
          </section>

          <section class="bg-slate-900 rounded-3xl p-6 mb-6 shadow-lg">
            <h3 class="t-label text-sky-300 mb-4">검색 확장 키워드</h3>
            <div class="flex flex-wrap gap-2">
              ${chips.length ? chips.map(c => `<span class="px-3 py-1.5 rounded-full bg-white/15 border border-white/30 t-meta font-bold text-white">${esc(c)}</span>`).join("") : `<span class="t-small text-slate-200">추출된 키워드가 없습니다.</span>`}
            </div>
          </section>

          <section class="bg-blue-50 border-2 border-blue-300 rounded-3xl p-6 mb-2">
            <h3 class="t-label text-blue-900 mb-3">후보 선정 방식</h3>
            <p class="t-small text-blue-950 prose-ko">전체 ${(state.nemoRowCount || state.nemoRows.length).toLocaleString()}명을 위 키워드로 훑어 1차 후보 ${Math.min(CONFIG.NEMO.LOCAL_CANDIDATES, Math.max(state.nemoRowCount || state.nemoRows.length, 1))}명을 추린 뒤, AI가 각 후보를 GENERAL USER · LEAD USER · EXTREME USER · DESIRE-DRIVEN USER 네 유형으로 분류하고 유형별로 3명씩 총 12명을 선정합니다.</p>
          </section>

          ${instructionBox("task-instruction", "Actions.analyzeTask(document.getElementById('task-instruction').value)", "예: 1인 가구 관점을 더 강조해 주세요", "과제 특성 다시 분석")}

          ${dock(primaryBtn(hasData ? (done ? "후보 12명 다시 선정하기" : "실제 데이터에서 12명 선정하기") : "데이터를 먼저 불러와 주세요", "Actions.selectNemoCandidates()", !hasData))}
        </div>`;
      }

      // 2단계 타겟 카드에 붙는 원본 데이터 블록 (네모트론 출신 타겟에만 표시)
      function nemoPersonaExtra(p) {
        const raw = (Array.isArray(p.nemoRaw) && p.nemoRaw.length) ? p.nemoRaw : (Array.isArray(p.nemoEvidence) ? p.nemoEvidence : []);
        return `
          <div class="mt-5 bg-sky-50 border-2 border-sky-400 rounded-2xl p-5">
            <div class="flex items-center justify-between gap-2 mb-3">
              <span class="t-label text-sky-900">네모트론 원본</span>
              ${Number.isFinite(p.nemoScore) ? `<span class="t-meta font-bold px-3 py-1 bg-sky-700 text-white rounded-lg flex-shrink-0">적합도 ${p.nemoScore}</span>` : ""}
            </div>
            <p class="t-small text-slate-900 mb-1"><b>${esc(p.nemoRealName || "이름 확인 필요")}</b>${p.nemoMeta ? ` · ${esc(p.nemoMeta)}` : ""}</p>
            ${p.nemoReason ? `<p class="t-small text-sky-950 prose-ko">${esc(p.nemoReason)}</p>` : ""}
            ${raw.length ? `<details class="mt-3 border-t-2 border-sky-200 pt-3">
              <summary class="t-small font-bold text-sky-900 cursor-pointer py-1 flex items-center gap-2"><i data-lucide="scan-search" class="w-5 h-5"></i>네모트론 데이터의 원문 보기</summary>
              <div class="mt-3">
                <button type="button" onclick="Actions.copyNemoRaw('${escAttr(p.id)}')"
                  class="w-full mb-3 py-3.5 rounded-xl bg-sky-700 text-white font-bold t-small flex items-center justify-center gap-2 active:scale-[0.98] transition-all">
                  <i data-lucide="copy" class="w-5 h-5"></i>이 원문을 클립보드에 복사
                </button>
                <div class="space-y-2 max-h-[26rem] overflow-y-auto">
                  ${raw.map(e => `<div class="bg-white border-2 border-sky-200 rounded-xl px-4 py-3">
                    <span class="block t-meta font-bold text-sky-900 mb-0.5">${esc(e.field)}</span>
                    <span class="block t-meta text-slate-800 prose-ko">${esc(e.value)}</span>
                  </div>`).join("")}
                </div>
              </div>
            </details>` : ""}
          </div>`;
      }

      // 현재 타겟 목록이 실제 데이터에서 나온 것인지 판단
      function nemoActive() {
        return state.personaSource === "nemotron" && !!state.taskAnalysis;
      }

      // 주제 화면 하단 버튼 — 데이터 소스에 따라 다음 행동이 달라집니다.
      function nemoTopicDock() {
        if (state.personaSource !== "nemotron") {
          return primaryBtn(state.categories.length ? "사용자 타겟 12명 다시 제안하기" : "사용자 타겟 12명 제안하기", "Actions.generatePersonas()");
        }
        const hasData = state.nemoRows.length > 0;
        const back = state.taskAnalysis ? `<div class="mb-3">${secondaryBtn("이전 과제 분석 결과 보기", "setState({step:101})", "file-search")}</div>` : "";
        return back + primaryBtn(hasData ? "과제 특성 분석하기" : "데이터를 먼저 불러와 주세요", "Actions.analyzeTask()", !hasData);
      }

      // 주제 화면에 얹히는 데이터 소스 선택 + 업로드 패널



      // 2단계 타겟 카드에 붙는 원본 근거 블록 (네모트론 출신 타겟에만 표시)

      function viewTopic() {
        return `<div class="page-top px-4 dock-space animate-fade-in">
          ${header("주제 설정", 0, (state.personaSource === "nemotron" && state.taskAnalysis) ? 101 : undefined)}
          <h2 class="t-h1 text-slate-900 mb-3">어떤 과제를 진행하고 싶으신가요?</h2>
          <p class="t-small text-slate-600 mb-8">해결하려는 문제나 타겟 시장을 구체적으로 적을수록 결과가 정확해집니다.</p>
          <label for="topic-input" class="sr-only">리서치 주제</label>
          <textarea id="topic-input" oninput="setDraft('topic', this.value)" rows="6"
            class="w-full p-5 bg-white border-2 border-slate-400 rounded-3xl shadow-md t-body text-slate-900 outline-none focus:border-blue-700 resize-none placeholder:text-slate-500"
            placeholder="예: 해외 여행 계획 시 정보의 파편화로 피로를 느끼는 1인 가구 직장인">${esc(draftOr("topic", state.researchTopic))}</textarea>
          ${nemoReconnectBanner()}
          ${nemoSourcePanel()}
          ${dock(nemoTopicDock())}
        </div>`;
      }

      function viewPersonas() {
        const catTotal = state.categories.length;
        const cats = state.categories.map((cat, ci) => {
          const m = String(cat.name).match(/^\s*(.+?)\s*\(([^)]+)\)\s*$/);
          const ko = m ? m[1] : cat.name;
          const en = m ? m[2] : "";
          return `
          <section class="mb-10 animate-fade-in">
            <div class="rounded-3xl overflow-hidden border-2 border-slate-900 shadow-lg mb-4">
              <div class="bg-slate-900 px-6 py-5 flex items-start justify-between gap-3">
                <div class="min-w-0">
                  <span class="block t-meta font-bold text-sky-300 tracking-widest mb-1">${esc((en || ko).toUpperCase())}</span>
                  <h3 class="t-h2 text-white">${esc(ko)}</h3>
                </div>
                <span class="t-meta font-bold text-white bg-white/20 border border-white/40 px-3 py-1.5 rounded-xl flex-shrink-0">${cat.personas.length}명</span>
              </div>
              ${cat.desc ? `<div class="bg-white px-6 py-4"><p class="t-small text-slate-800 prose-ko">${esc(cat.desc)}</p></div>` : ""}
            </div>
            <div class="space-y-5">
              ${cat.personas.map((p, pi) => `
                <article class="bg-white rounded-3xl border-2 border-slate-400 shadow-lg overflow-hidden">
                  <div class="flex items-start gap-3 px-6 pt-6">
                    <span class="w-11 h-11 rounded-2xl bg-slate-900 text-white font-bold t-h3 flex items-center justify-center flex-shrink-0">${ci + 1}-${pi + 1}</span>
                    <h4 class="t-h3 text-slate-900 flex-1 min-w-0 pt-1">${esc(p.name)}</h4>
                  </div>
                  <div class="px-6 pt-4 pb-6">
                    <p class="t-body text-slate-800 prose-ko mb-5">${esc(p.description)}</p>
                    <div class="bg-blue-50 border-2 border-blue-300 rounded-2xl p-5">
                      <h5 class="t-label text-blue-900 mb-2">핵심 니즈</h5>
                      <p class="t-small text-slate-900 prose-ko">${esc(p.needs)}</p>
                    </div>
                    ${p.source === "nemotron" ? nemoPersonaExtra(p) : ""}
                  </div>
                </article>`).join("")}
            </div>
          </section>`;
        }).join("");

        const manual = state.manualPersonas.length ? `
          <section class="mb-10">
            <div class="bg-slate-900 rounded-3xl p-6 mb-4">
              <h3 class="t-h3 text-white flex items-center gap-2"><span class="w-1.5 h-6 bg-sky-400 rounded-full"></span>사용자 직접 추가</h3>
            </div>
            <div class="space-y-4">
              ${state.manualPersonas.map(p => `
                <article class="bg-white rounded-[2rem] p-6 border-2 border-slate-300 shadow-md relative">
                  <button type="button" aria-label="${escAttr(p.name)} 삭제" onclick="Actions.removeManualPersona('${escAttr(p.id)}')"
                    class="absolute top-5 right-5 p-2.5 rounded-full bg-slate-50 text-slate-500 hover:text-red-600 hover:bg-red-50 transition-colors">
                    <i data-lucide="trash-2" class="w-5 h-5"></i>
                  </button>
                  <h4 class="t-h3 text-slate-900 mb-3 pr-12">${esc(p.name)}</h4>
                  <p class="t-body text-slate-700 prose-ko">${esc(p.description)}</p>
                </article>`).join("")}
            </div>
          </section>` : "";

        return `<div class="page-top px-4 dock-space animate-fade-in">
          ${header("타겟 제안", nemoActive() ? 101 : 1)}
          <h2 class="t-h1 text-slate-900 mb-3">핵심 인터뷰 타겟을 제안합니다</h2>
          <p class="t-small text-slate-600 mb-8">${nemoActive() ? `GENERAL · LEAD · EXTREME · DESIRE-DRIVEN 네 개 카테고리로, 업로드한 데이터 ${(state.nemoRowCount || 0).toLocaleString()}명에서 12명을 선정했습니다.` : "GENERAL · LEAD · EXTREME · DESIRE-DRIVEN 네 개 카테고리로 12명을 구성했습니다. 아래 지시 입력으로 목록을 다시 만들 수 있습니다."}</p>
          ${nemoReconnectBanner()}
          ${cats}
          ${manual}

          <section class="bg-white border-2 border-slate-300 rounded-3xl p-6 shadow-md">
            <h3 class="t-label text-slate-600 mb-4 flex items-center gap-2"><i data-lucide="pen-tool" class="w-5 h-5"></i> 직접 타겟 추가</h3>
            <label for="manual-p-name" class="sr-only">타겟 이름</label>
            <input type="text" id="manual-p-name" value="${escAttr(draft("manual-p-name"))}" oninput="setDraft('manual-p-name', this.value)"
              class="w-full p-4 bg-white border-2 border-slate-400 rounded-2xl t-small text-slate-900 outline-none focus:border-blue-700 mb-3 placeholder:text-slate-500"
              placeholder="이름 및 특징 (예: 프로 출장러 김철수)">
            <label for="manual-p-desc" class="sr-only">타겟 설명</label>
            <textarea id="manual-p-desc" rows="4" oninput="setDraft('manual-p-desc', this.value)"
              class="w-full p-4 bg-white border-2 border-slate-400 rounded-2xl t-small text-slate-900 outline-none focus:border-blue-700 resize-none mb-3 placeholder:text-slate-500"
              placeholder="상세 설명과 니즈를 입력하세요">${esc(draft("manual-p-desc"))}</textarea>
            <button type="button" onclick="Actions.addManualPersona()" class="w-full py-4 rounded-2xl bg-slate-800 text-white font-bold t-small active:scale-[0.98] transition-all">목록에 추가</button>
          </section>

          ${instructionBox("persona-instruction", "Actions.generatePersonas(document.getElementById('persona-instruction').value)", "예: 40~60대 비중을 늘려 주세요", "타겟 수정 지시하기")}

          ${dock(primaryBtn("인터뷰 대상 선택하기", "setState({step:3})"))}
        </div>`;
      }

      function personaCard(p, index) {
        const count = state.sessions.filter(s => s.personaId === p.id).length;
        const on = state.selectedPersonaId === p.id;
        return `<button type="button" onclick="Actions.selectPersona('${escAttr(p.id)}')" aria-pressed="${on}"
          class="w-full text-left p-5 rounded-[2rem] border-2 transition-all bg-white ${on ? "border-blue-600 shadow-lg ring-2 ring-blue-600/15" : "border-slate-200 hover:border-blue-300 shadow-md"}">
          <div class="flex items-center justify-between gap-2 mb-2">
            <div class="flex items-center gap-3 min-w-0">
              <span class="w-9 h-9 rounded-full flex items-center justify-center flex-shrink-0 font-bold t-meta ${on ? "bg-blue-600 text-white" : "bg-slate-200 text-slate-700"}">${on ? '<i data-lucide="check" class="w-5 h-5"></i>' : esc(index)}</span>
              <h3 class="t-h3 text-slate-900 truncate">${esc(p.name)}</h3>
            </div>
            ${count ? `<span class="t-meta font-bold px-2.5 py-1 bg-slate-800 text-white rounded-lg flex-shrink-0">인터뷰 ${count}회</span>` : ""}
          </div>
          <p class="t-small text-slate-700 prose-ko pl-12 line-clamp-3">${esc(p.description)}</p>
        </button>`;
      }

      function viewSelectPersona() {
        const groups = state.categories.map(cat => `
          <div class="mb-8">
            <h3 class="t-h3 text-slate-800 mb-4 flex items-center gap-2"><span class="w-1.5 h-5 bg-blue-600 rounded-full"></span>${esc(cat.name)}</h3>
            <div class="space-y-3">${cat.personas.map((p, i) => personaCard(p, i + 1)).join("")}</div>
          </div>`).join("");

        const manual = state.manualPersonas.length ? `
          <div class="mb-8">
            <h3 class="t-h3 text-slate-800 mb-4 flex items-center gap-2"><span class="w-1.5 h-5 bg-sky-500 rounded-full"></span>사용자 직접 추가</h3>
            <div class="space-y-3">${state.manualPersonas.map((p, i) => personaCard(p, i + 1)).join("")}</div>
          </div>` : "";

        const chosen = findPersona(state.selectedPersonaId);
        return `<div class="page-top px-4 dock-space animate-fade-in">
          ${header("대상 선택", 2)}
          <h2 class="t-h1 text-slate-900 mb-3">누구와 먼저 대화를 나눌까요?</h2>
          <p class="t-small text-slate-600 mb-3">이미 인터뷰한 타겟도 다시 선택해 새 인터뷰를 진행할 수 있습니다.</p>
          ${sessionBadge()}
          ${groups}${manual}
          ${dock(`
            ${chosen ? `<p class="t-meta text-slate-600 mb-3 truncate">선택한 타겟 · ${esc(chosen.name)}</p>` : ""}
            ${primaryBtn(chosen ? "질문 리스트 생성" : "타겟을 선택해 주세요", "Actions.generateSurveys()", !chosen)}
          `)}
        </div>`;
      }

      function viewQuestions() {
        const selCount = state.selectedQuestionIds.length;
        const body = state.surveys.map(s => `
          <section class="bg-white rounded-[2rem] px-4 py-5 border-2 border-slate-300 shadow-md mb-6">
            <h3 class="t-h3 text-slate-900 mb-4 flex items-center gap-2 px-1">
              <span class="w-1.5 h-5 ${s.source === "manual" ? "bg-sky-500" : "bg-blue-600"} rounded-full"></span>${esc(s.title)}
            </h3>
            <div class="space-y-2.5">
              ${s.questions.map(q => {
                const on = state.selectedQuestionIds.includes(q.id);
                if (state.editingQuestionId === q.id) {
                  return `<div class="px-3.5 py-3.5 rounded-2xl border-2 border-blue-500 bg-blue-50">
                    <label for="qedit" class="sr-only">질문 수정</label>
                    <textarea id="qedit" rows="3" oninput="setDraft('qedit', this.value)"
                      class="w-full p-3 rounded-xl border border-blue-300 bg-white t-small text-slate-900 outline-none focus:border-blue-600 resize-none mb-3">${esc(draft("qedit"))}</textarea>
                    <div class="flex gap-2">
                      <button type="button" onclick="Actions.saveQuestionEdit('${escAttr(q.id)}')" class="flex-1 min-w-0 py-3 rounded-xl bg-blue-600 text-white font-bold t-meta active:scale-95 transition-all">수정 완료</button>
                      <button type="button" onclick="Actions.cancelQuestionEdit()" class="px-5 py-3 rounded-xl bg-white border border-slate-300 text-slate-700 font-bold t-meta">취소</button>
                    </div>
                  </div>`;
                }
                return `<div class="px-3.5 py-3.5 rounded-2xl border-2 transition-all flex items-start ${on ? "border-blue-600 bg-blue-50" : "border-slate-200 bg-slate-50"}">
                  <button type="button" onclick="Actions.toggleQuestion('${escAttr(q.id)}')" aria-pressed="${on}" class="flex-1 flex gap-2.5 items-start text-left min-w-0">
                    <span class="w-6 h-6 rounded-full border-2 flex items-center justify-center flex-shrink-0 mt-1 ${on ? "border-blue-600 bg-blue-600 text-white" : "border-slate-300 bg-white text-transparent"}"><i data-lucide="check" class="w-4 h-4"></i></span>
                    <span class="t-small ${on ? "text-blue-900 font-bold" : "text-slate-700"} prose-ko">${esc(q.text)}</span>
                  </button>
                </div>`;
              }).join("")}
            </div>
          </section>`).join("");

        const persona = findPersona(state.selectedPersonaId);
        return `<div class="page-top px-4 dock-space animate-fade-in">
          ${header("질문 설계", 3)}
          <h2 class="t-h1 text-slate-900 mb-3">핵심 질문을 골라주세요</h2>
          <p class="t-small text-slate-600 mb-5">${persona ? esc(persona.name) + "에게" : "선택한 타겟에게"} 물어볼 질문입니다. 필요한 질문을 골라 주세요.</p>
          <div class="flex gap-3 mb-6">
            <button type="button" onclick="Actions.selectAllQuestions()" class="t-meta font-bold text-blue-700 underline underline-offset-4">전체 선택</button>
            <button type="button" onclick="Actions.clearQuestions()" class="t-meta font-bold text-slate-600 underline underline-offset-4">선택 해제</button>
          </div>
          ${body}

          <section class="bg-slate-100 border-2 border-slate-300 rounded-3xl p-6">
            <h3 class="t-label text-slate-600 mb-4 flex items-center gap-2"><i data-lucide="plus-circle" class="w-5 h-5"></i> 직접 질문 추가</h3>
            <label for="manual-q" class="sr-only">추가할 질문</label>
            <textarea id="manual-q" rows="4" oninput="setDraft('manual-q', this.value)"
              class="w-full p-4 bg-white border-2 border-slate-300 rounded-2xl t-small text-slate-900 outline-none focus:border-blue-600 resize-none mb-3 placeholder:text-slate-500"
              placeholder="줄바꿈으로 구분하여 질문을 입력하세요">${esc(draft("manual-q"))}</textarea>
            <button type="button" onclick="Actions.addManualQuestions()" class="w-full py-4 rounded-2xl bg-slate-800 text-white font-bold t-small active:scale-[0.98] transition-all">추가하기</button>
          </section>

          ${instructionBox("survey-instruction", "Actions.generateSurveys(document.getElementById('survey-instruction').value)", "예: 가격 민감도를 더 깊게 물어봐 주세요", "질문 수정 지시하기")}

          ${dock(primaryBtn(selCount ? `질문 확정 (${selCount}개)` : "질문을 선택해 주세요", "setState({step:5})", selCount === 0))}
        </div>`;
      }

      function viewConfirm() {
        const persona = findPersona(state.selectedPersonaId);
        const qs = selectedQuestions();
        return `<div class="page-top px-4 dock-space animate-fade-in">
          ${header("인터뷰 준비", 4)}
          <div class="text-center mb-8">
            <div class="w-20 h-20 bg-blue-100 text-blue-700 rounded-full flex items-center justify-center mx-auto mb-5 border border-blue-200">
              <i data-lucide="mic" class="w-10 h-10"></i>
            </div>
            <h2 class="t-h1 text-slate-900 mb-3">인터뷰 준비 완료</h2>
            <p class="t-small text-slate-600">아래 타겟과 질문 ${qs.length}개로 가상 인터뷰를 진행합니다.</p>
          </div>

          <section class="bg-white rounded-[2rem] p-7 border-2 border-slate-300 shadow-md mb-6">
            <div class="pb-5 mb-5 border-b-2 border-slate-300 text-center">
              <h3 class="t-h2 text-blue-900">${esc(persona ? persona.name : "선택된 타겟 없음")}</h3>
            </div>
            ${scrollBox("confirm-q", qs.map((q, i) => `<div class="flex gap-3 bg-slate-100 border-2 border-slate-300 rounded-2xl p-4 mb-3 last:mb-0">
                <span class="t-small font-bold text-blue-700 flex-shrink-0">Q${i + 1}.</span>
                <p class="t-small text-slate-900 prose-ko">${esc(q.text)}</p>
              </div>`).join(""), "21rem")}
          </section>

          ${dock(primaryBtn("대화 시작하기", "Actions.performInterview()", !persona || qs.length === 0))}
        </div>`;
      }

      function qaCard(qa, i, opts) {
        const on = opts.selectable && opts.selectedIds.includes(qa.id);
        const inner = `
          <div class="flex gap-3 mb-4 ${opts.selectable ? "pr-9" : ""}">
            <span class="w-9 h-9 rounded-full ${qa.followUp ? "bg-sky-100 text-sky-700" : "bg-slate-100 text-slate-700"} font-bold flex items-center justify-center flex-shrink-0 t-meta">Q${i + 1}</span>
            <p class="t-small font-bold text-slate-900 prose-ko pt-1">${esc(qa.q)}</p>
          </div>
          <div class="bg-slate-50 border-2 border-slate-300 rounded-2xl p-5">
            <p class="t-body text-slate-700 prose-ko">${esc(qa.a)}</p>
          </div>`;

        if (!opts.selectable) {
          return `<article class="p-6 rounded-[2rem] border-2 border-slate-200 bg-white shadow-md">${inner}</article>`;
        }
        return `<button type="button" onclick="Actions.toggleQa('${escAttr(qa.id)}')" aria-pressed="${on}"
          class="w-full text-left p-6 rounded-[2rem] border-2 bg-white relative transition-all ${on ? "border-blue-600 shadow-md ring-2 ring-blue-600/15" : "border-slate-200 shadow-md"}">
          <span class="absolute top-6 right-6 w-6 h-6 rounded-full border-2 flex items-center justify-center ${on ? "border-blue-600 bg-blue-600 text-white" : "border-slate-300 bg-white text-transparent"}"><i data-lucide="check" class="w-4 h-4"></i></span>
          ${inner}
        </button>`;
      }

      function viewInterview() {
        const s = activeSession();
        return `<div class="page-top px-4 dock-space animate-fade-in">
          ${header("인터뷰 진행", 5)}
          <h2 class="t-h1 text-slate-900 mb-3">가상 인터뷰 대화를 진행해 주세요</h2>
          <p class="t-small text-slate-600 mb-8">${esc(s.personaName)}의 답변입니다. 추가 질문으로 대화를 더 깊게 이어갈 수 있습니다.</p>

          <div class="space-y-5 mb-10">
            ${s.qaPairs.map((qa, i) => qaCard(qa, i, { selectable: false })).join("")}
          </div>

          <section class="bg-slate-700 rounded-3xl p-6 shadow-xl">
            <h3 class="t-label text-blue-200 mb-3">추가 질문하기</h3>
            <label for="followup" class="sr-only">추가 질문</label>
            <textarea id="followup" rows="3" oninput="setDraft('followup', this.value)"
              class="w-full block min-w-0 bg-white/10 border border-white/20 rounded-xl px-4 py-3.5 text-white t-small outline-none resize-none placeholder:text-slate-300 focus:border-blue-400 mb-3"
              placeholder="더 궁금한 점을 물어보세요">${esc(draft("followup"))}</textarea>
            <button type="button" onclick="Actions.askFollowUp()"
              class="w-full py-4 rounded-xl bg-blue-600 hover:bg-blue-500 text-white font-bold t-small flex items-center justify-center gap-2 active:scale-[0.98] transition-all">
              <i data-lucide="send" class="w-5 h-5"></i>추가 질문하기
            </button>
          </section>

          ${dock(primaryBtn("인터뷰 결과 정리하기", "setState({step:7})"))}
        </div>`;
      }

      function viewResult() {
        const s = activeSession();
        const selCount = s.selectedQaIds.length;
        return `<div class="page-top px-4 dock-space animate-fade-in">
          ${header("인터뷰 결과", 6)}
          <h2 class="t-h1 text-slate-900 mb-3">중요한 인사이트를 선택해 주세요</h2>
          <p class="t-small text-slate-600 mb-8">선택한 대화와 직접 작성한 인사이트를 바탕으로 핵심 가치를 추론합니다.</p>

          <section class="bg-slate-900 rounded-[2rem] p-7 text-white mb-8 shadow-xl relative overflow-hidden">
            <div class="absolute top-0 right-0 w-40 h-40 bg-blue-500/30 blur-3xl rounded-full"></div>
            <div class="relative">
              <span class="inline-block bg-blue-600 t-meta font-bold px-3 py-1 rounded-full mb-3">SUMMARY</span>
              <h3 class="t-h1 italic mb-4">${esc(s.personaName)}</h3>

            <div class="flex gap-3 flex-shrink-0">
              <button type="button" onclick="Actions.selectAllQa()" class="t-meta font-bold text-blue-700 underline underline-offset-4">전체 선택</button>
              <button type="button" onclick="Actions.clearQa()" class="t-meta font-bold text-slate-600 underline underline-offset-4">선택 해제</button>
            </div>
          </div>

          <div class="space-y-5 mb-10">
            ${s.qaPairs.map((qa, i) => qaCard(qa, i, { selectable: true, selectedIds: s.selectedQaIds })).join("")}
          </div>

          ${s.keyInsights ? `<section class="bg-blue-600 rounded-[2rem] p-7 text-white mb-10 shadow-lg">
            <h3 class="t-label text-blue-100 mb-4 flex items-center gap-2"><i data-lucide="zap" class="w-5 h-5 text-yellow-300"></i> AI Key Insights</h3>
            <p class="t-small text-blue-50 prose-ko">${esc(s.keyInsights)}</p>
          </section>` : ""}

          <section class="bg-white border-2 border-blue-600 rounded-[2rem] p-6 shadow-md">
            <h3 class="t-h3 text-slate-900 mb-3 flex items-center gap-2"><i data-lucide="lightbulb" class="w-5 h-5 text-amber-500"></i> 직접 발견한 인사이트</h3>
            <p class="t-meta text-slate-600 mb-4">비워 두어도 괜찮습니다. 적어 두면 추론에 함께 반영됩니다.</p>
            <label for="user-insight" class="sr-only">직접 발견한 인사이트</label>
            <textarea id="user-insight" rows="6" oninput="setDraft('user-insight', this.value)"
              class="w-full p-4 bg-white border-2 border-slate-400 rounded-2xl t-small text-slate-900 outline-none focus:border-blue-700 resize-none placeholder:text-slate-500"
              placeholder="인터뷰를 통해 느낀 점이나 아이디어를 적어주세요">${esc(draftOr("user-insight", s.userInsight))}</textarea>

          ${dock(`
            <p class="t-meta text-slate-600 mb-3">${selCount ? `대화 ${selCount}개 선택됨` : "전체 대화 반영"} · ${esc(s.inferencePerspective)}</p>
            <div class="mb-3">${secondaryBtn("다른 타겟 인터뷰하기", "Actions.interviewAnotherTarget()", "users")}</div>
            ${primaryBtn("핵심 가치 추론하기", "Actions.generateInferences()")}
          `)}
        </div>`;
      }

      function viewInferences() {
        const s = activeSession();
        return `<div class="page-top px-4 dock-space animate-fade-in">
          ${header("핵심 가치 추론", 7)}
          <h2 class="t-h1 text-slate-900 mb-3">인터뷰 기반 핵심 가치 추론</h2>
          <p class="t-small text-slate-600 mb-8">${esc(s.inferencePerspective)}에서 도출했습니다. 가장 중요한 가치 하나를 선택해 주세요.</p>

          <div class="space-y-4 mb-10">
            ${s.inferences.map((inf, i) => {
              const on = s.selectedInferenceId === inf.id;
              return `<button type="button" onclick="Actions.selectInference('${escAttr(inf.id)}')" aria-pressed="${on}"
                class="w-full text-left p-6 rounded-[2rem] border-2 bg-white relative transition-all ${on ? "border-blue-600 shadow-md ring-2 ring-blue-600/15" : "border-slate-200 shadow-md"}">
                <span class="absolute top-6 right-6 w-6 h-6 rounded-full border-2 flex items-center justify-center ${on ? "border-blue-600 bg-blue-600 text-white" : "border-slate-300 bg-white text-transparent"}"><i data-lucide="check" class="w-4 h-4"></i></span>
                <span class="inline-block px-3 py-1 bg-blue-50 text-blue-700 border border-blue-100 rounded-lg t-meta font-bold mb-3">INFERENCE ${i + 1}</span>
                <h3 class="t-h3 text-slate-900 mb-3 pr-9">${esc(inf.title)}</h3>
                <p class="t-body text-slate-700 prose-ko">${esc(inf.description)}</p>
              </button>`;
            }).join("")}
          </div>

          ${branchSummary(s)}

          ${dock(`
            ${perspectiveRow(s.inferencePerspective, p => `Actions.generateInferences('${p}')`)}
            <p class="t-meta text-slate-600 mb-3">관점을 누르면 그 관점으로 다시 추론합니다. 이전 결과는 분기 기록으로 보존됩니다.</p>
            ${primaryBtn(s.selectedInferenceId ? "선택한 추론으로 컨셉 도출" : "추론을 선택해 주세요", "Actions.generateConcepts()", !s.selectedInferenceId)}
          `)}
        </div>`;
      }

      function viewConcepts() {
        const s = activeSession();
        const inf = s.inferences.find(i => i.id === s.selectedInferenceId);
        return `<div class="page-top px-4 dock-space animate-fade-in">
          ${header("디자인 컨셉", 8)}
          <h2 class="t-h1 text-slate-900 mb-3">핵심 추론 기반 디자인 컨셉</h2>
          ${inf ? `<p class="t-small text-slate-600 mb-2">기반 추론 · ${esc(inf.title)}</p>` : ""}
          <p class="t-small text-slate-600 mb-8">${esc(s.conceptPerspective)}에서 도출했습니다. 시나리오로 발전시킬 컨셉 하나를 선택해 주세요.</p>

          <div class="space-y-4 mb-10">
            ${s.concepts.map((c, i) => {
              const on = s.selectedConceptId === c.id;
              return `<button type="button" onclick="Actions.selectConcept('${escAttr(c.id)}')" aria-pressed="${on}"
                class="w-full text-left p-6 rounded-[2rem] border-2 bg-white relative transition-all ${on ? "border-blue-600 shadow-md ring-2 ring-blue-600/15" : "border-slate-200 shadow-md"}">
                <span class="absolute top-6 right-6 w-6 h-6 rounded-full border-2 flex items-center justify-center ${on ? "border-blue-600 bg-blue-600 text-white" : "border-slate-300 bg-white text-transparent"}"><i data-lucide="check" class="w-4 h-4"></i></span>
                <span class="inline-block px-3 py-1 bg-blue-50 text-blue-700 border border-blue-100 rounded-lg t-meta font-bold mb-3">CONCEPT ${i + 1}</span>
                <h3 class="t-h3 text-slate-900 mb-3 pr-9">${esc(c.title)}</h3>
                <div class="bg-blue-50 border border-blue-100 rounded-2xl p-4 mb-4">
                  <h4 class="t-label text-blue-700 mb-1">핵심 가치</h4>
                  <p class="t-small text-blue-900 prose-ko">${esc(c.coreValue)}</p>
                </div>
                <p class="t-body text-slate-700 prose-ko">${esc(c.description)}</p>
              </button>`;
            }).join("")}
          </div>

          ${branchSummary(s)}

          <div class="mb-10">${secondaryBtn("다른 타겟 인터뷰하기", "Actions.interviewAnotherTarget()", "users")}</div>

          ${dock(`
            ${perspectiveRow(s.conceptPerspective, p => `Actions.generateConcepts('${p}')`)}
            ${primaryBtn(s.selectedConceptId ? "컨셉 시나리오 보기" : "컨셉을 선택해 주세요", "Actions.generateScenario()", !s.selectedConceptId)}
          `)}
        </div>`;
      }

      function branchSummary(s) {
        if (!s.branches.length) return "";
        return `<section class="mb-10">
          <h3 class="t-label text-slate-600 mb-3">이전에 탐색한 분기 ${s.branches.length}건 · 리포트에 전체 내용이 포함됩니다</h3>
          <div class="space-y-2">
            ${s.branches.map(b => `<div class="bg-slate-100 border-2 border-slate-300 rounded-2xl p-4">
              <p class="t-meta font-bold text-slate-600 mb-1">${esc(b.reason)}</p>
              <p class="t-small text-slate-800">${esc(b.selectedConceptTitle || b.selectedInferenceTitle || (b.concepts[0] && b.concepts[0].title) || (b.inferences[0] && b.inferences[0].title) || "기록 보존됨")}</p>
            </div>`).join("")}
          </div>
        </section>`;
      }

      function viewScenario() {
        const s = activeSession();
        const c = s.concepts.find(x => x.id === s.selectedConceptId);
        return `<div class="page-top px-4 dock-space animate-fade-in">
          ${header("컨셉 시나리오", 9)}
          <h2 class="t-h1 text-slate-900 mb-3">사용자 경험 시나리오</h2>
          <p class="t-small text-slate-600 mb-8">${c ? esc(c.title) : "선택한 컨셉"}이 적용된 ${esc(s.personaName)}의 하루입니다.</p>

          <section class="bg-white rounded-[2rem] p-7 border-2 border-slate-300 shadow-md mb-8">
            <div class="flex items-center justify-between gap-3 mb-4">
              <h3 class="t-label text-slate-600">SCENARIO</h3>
              <button type="button" aria-label="시나리오 복사" onclick="Actions.copyScenario()" class="p-2.5 rounded-full bg-slate-100 text-slate-700 hover:text-blue-700 hover:bg-blue-50 transition-colors flex-shrink-0">
                <i data-lucide="copy" class="w-5 h-5"></i>
              </button>
            </div>
            <p class="t-body text-slate-800 prose-ko">${esc(s.scenario)}</p>
          </section>

          ${state.sessions.length > 1 ? `<section class="mb-8">
            <h3 class="t-label text-slate-600 mb-3">이 프로젝트의 인터뷰 ${state.sessions.length}건</h3>
            <div class="space-y-2">
              ${state.sessions.map(x => `<button type="button" onclick="Actions.openSession('${escAttr(x.id)}')"
                class="w-full text-left px-4 py-3 rounded-2xl border ${x.id === s.id ? "border-blue-600 bg-blue-50" : "border-slate-200 bg-white"} transition-all">
                <span class="block t-small font-bold text-slate-900 truncate">${esc(x.personaName)}</span>
                <span class="block t-meta text-slate-600">${esc(nowLabel(x.createdAt))} · ${x.scenario ? "시나리오 완료" : x.concepts.length ? "컨셉 도출" : x.inferences.length ? "추론 완료" : "인터뷰 완료"}</span>
              </button>`).join("")}
            </div>
          </section>` : ""}

          <div class="mb-6">
            ${secondaryBtn("리포트를 파일로 저장", "Actions.downloadReport()", "download")}
          </div>

          ${dock(`
            ${primaryBtn("전체 리포트 복사하기", "Actions.copyReport()")}
          `)}
        </div>`;
      }

      /* =========================================================
         16. 오버레이
         ========================================================= */
      function overlays() {
        let html = "";

        if (state.isAnalyzing) {
          html += `<div class="fixed inset-0 z-[10000] bg-white/95 backdrop-blur-sm flex flex-col items-center justify-center px-8 text-center max-w-[430px] mx-auto animate-fade-in" role="status" aria-live="polite">
            <div class="spinner-ring mb-8" role="presentation"></div>
            <h2 class="t-h2 text-slate-900 mb-2">${esc(state.loadingMsg)}</h2>
            <p class="t-small text-slate-600 mb-8">최대 1분 정도 걸릴 수 있습니다</p>
            <button type="button" onclick="Actions.cancel()" class="px-7 py-3.5 rounded-2xl border-2 border-slate-300 text-slate-700 font-bold t-small hover:bg-slate-50 active:scale-95 transition-all">취소</button>
          </div>`;
        }

        if (state.errorMsg) {
          html += `<div class="fixed inset-0 z-[10002] flex items-center justify-center bg-black/50 px-6 backdrop-blur-sm" role="alertdialog" aria-modal="true" aria-labelledby="err-title">
            <div class="bg-white p-8 rounded-3xl w-full max-w-sm text-center shadow-2xl animate-scale-in">
              <i data-lucide="alert-triangle" class="text-red-600 mx-auto mb-4 w-12 h-12"></i>
              <h2 id="err-title" class="t-h3 text-slate-900 mb-6">${esc(state.errorMsg)}</h2>
              <button type="button" onclick="setState({errorMsg:null})" class="w-full bg-slate-900 text-white py-4 rounded-2xl font-bold t-small">확인</button>
            </div>
          </div>`;
        }
        return html;
      }

      /* =========================================================
         17. 메인 렌더 — 예외가 나도 화면이 멈추지 않도록 방어
         ========================================================= */
      function captureUI() {
        const el = document.activeElement;
        const f = (el && el.id && (el.tagName === "INPUT" || el.tagName === "TEXTAREA"))
          ? { id: el.id, start: el.selectionStart, end: el.selectionEnd } : null;
        return { focus: f, scrollY: window.scrollY };
      }
      function restoreUI(snap, resetScroll) {
        if (snap.focus) {
          const el = document.getElementById(snap.focus.id);
          if (el) {
            el.focus({ preventScroll: true });
            try { el.setSelectionRange(snap.focus.start, snap.focus.end); } catch (e) { /* range 미지원 타입 */ }
          }
        }
        window.scrollTo(0, resetScroll ? 0 : snap.scrollY);
      }

      function fallback(backStep, msg) {
        return `<div class="page-top px-6 min-h-screen">
          <div class="bg-white border-2 border-slate-300 rounded-3xl p-8 text-center shadow-md">
            <i data-lucide="compass" class="w-12 h-12 text-slate-500 mx-auto mb-4"></i>
            <h2 class="t-h3 text-slate-900 mb-2">${esc(msg)}</h2>
            <p class="t-small text-slate-600 mb-6">이전 단계로 돌아가 다시 실행해 주세요.</p>
            ${primaryBtn("이전 단계로", `setState({step:${backStep}})`)}
          </div>
        </div>`;
      }

      function body() {
        const s = activeSession();
        switch (state.step) {
          case -1: return viewAuth();
          case 0:  return viewHome();
          case 1:  return viewTopic();
          case 101: return state.taskAnalysis ? viewTaskAnalysis() : fallback(1, "분석된 과제 특성이 없습니다.");
          case 2:  return state.categories.length ? viewPersonas() : fallback(1, "제안된 타겟이 없습니다.");
          case 3:  return (state.categories.length || state.manualPersonas.length) ? viewSelectPersona() : fallback(1, "선택할 타겟이 없습니다.");
          case 4:  return state.surveys.length ? viewQuestions() : fallback(3, "생성된 인터뷰 질문이 없습니다.");
          case 5:  return state.selectedQuestionIds.length ? viewConfirm() : fallback(4, "선택된 질문이 없습니다.");
          case 6:  return (s && s.qaPairs.length) ? viewInterview() : fallback(5, "진행된 인터뷰가 없습니다.");
          case 7:  return (s && s.qaPairs.length) ? viewResult() : fallback(5, "정리할 인터뷰 결과가 없습니다.");
          case 8:  return (s && s.inferences.length) ? viewInferences() : fallback(7, "도출된 핵심 가치 추론이 없습니다.");
          case 9:  return (s && s.concepts.length) ? viewConcepts() : fallback(8, "도출된 디자인 컨셉이 없습니다.");
          case 10: return (s && s.scenario) ? viewScenario() : fallback(9, "작성된 컨셉 시나리오가 없습니다.");
          default: return fallback(0, "요청한 화면을 찾을 수 없습니다.");
        }
      }

      function render(resetScroll) {
        const root = document.getElementById("root");
        const snap = captureUI();
        const shell = "w-full max-w-[430px] mx-auto bg-slate-100 min-h-screen relative overflow-x-hidden shadow-2xl";
        let inner;
        try {
          inner = body();
        } catch (err) {
          // 여기서 예외가 나면 innerHTML 대입 자체가 실행되지 않아
          // "버튼을 눌렀는데 아무 일도 일어나지 않는" 백지 상태가 된다.
          console.error("render 실패:", err);
          inner = fallback(0, "화면을 그리는 중 문제가 발생했습니다.");
        }
        try {
          root.innerHTML = `<div class="${shell}">${inner}${overlays()}</div>`;
          if (window.lucide && typeof lucide.createIcons === "function") lucide.createIcons();
          syncLayout();
          initScrollBoxes();
        } catch (err) {
          console.error("DOM 갱신 실패:", err);
          root.innerHTML = `<div class="${shell}"><div class="p-8 t-body">화면을 표시할 수 없습니다. 새로고침해 주세요.</div></div>`;
        }
        restoreUI(snap, resetScroll);
      }

      /* =========================================================
         18. 부팅
         ========================================================= */
      document.addEventListener("keydown", (e) => {
        if (e.key !== "Escape") return;
        if (state.errorMsg) setState({ errorMsg: null });
        else if (state.isAnalyzing) Actions.cancel();
        else if (state.editingQuestionId) Actions.cancelQuestionEdit();
      });

      setInterval(() => { try { persist(false); } catch (e) { console.warn("자동 저장 실패", e); } }, CONFIG.AUTOSAVE_MS);
      window.addEventListener("beforeunload", () => { try { persist(false); } catch (e) { /* 무시 */ } });

      const migrated = migrateLegacy();
      render(true);
      if (migrated) toast(`이전 버전 프로젝트 ${migrated}건을 가져왔습니다.`, "info");
    })();
  </script>
</body>
</html>
